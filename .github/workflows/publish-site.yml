name: Publish policy pages

# Publishes only the site/ folder (privacy policy and terms) to GitHub Pages,
# so the rest of the repository, including docs/, is never published.
# The deploy fails until GitHub Pages is enabled with the "GitHub Actions"
# source in the repository settings.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/publish-site.yml"

permissions:
  contents: read
  pages: write
  # Lets deploy-pages prove to GitHub that this run owns the deployment.
  id-token: write

# One Pages deploy at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
