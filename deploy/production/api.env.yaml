# Non-secret runtime settings for the hosted production Go API (nurseflow-api-prod).
# Secrets come from Secret Manager (see bootstrap-gcp.ps1). The deploy workflow
# appends NURSEFLOW_SOLVER_URL after looking up the production solver's URL.
NURSEFLOW_SUPABASE_PROJECT_REF: mkljczezkyqtuplzedpj
# Production's pooler is on Supabase's aws-1 cluster (development's is aws-0);
# the aws-0 host answers "tenant/user not found" for this project.
NURSEFLOW_DB_HOST: aws-1-us-east-1.pooler.supabase.com
# The production app is mobile-only and phones send no Origin header. An empty
# list makes the API refuse every browser origin (see backend/internal/httpapi/cors.go).
NURSEFLOW_WEB_ORIGINS: ""
